---
layout: default
---
<article class="shell article-wrap">
  <a class="breadcrumb" href="{{ '/about/' | relative_url }}#{{ page.group }}-heading">← 소개로 돌아가기</a>
  <header class="article-head">
    <span class="pill">{{ page.kind }}</span>
    <h1>{{ page.title }}</h1>
    <p class="article-meta">{{ page.period }} · {{ page.result }}</p>
  </header>
  <div class="article-body">
    {{ content }}
    {% if page.evidence.size > 0 %}
    <section class="evidence-gallery" aria-labelledby="evidence-heading">
      <h2 id="evidence-heading">인증 자료</h2>
      {% for item in page.evidence %}
      <figure>
        <a href="{{ item.image | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ item.caption | escape }} 원본 보기 (새 창)">
          <img src="{{ item.image | relative_url }}" alt="{{ item.caption | escape }}" loading="lazy" decoding="async">
        </a>
        <figcaption>{{ item.caption }} <span>· 원본 보기 ↗</span></figcaption>
      </figure>
      {% endfor %}
    </section>
    {% endif %}
  </div>
</article>
