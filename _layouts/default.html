<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101218">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v={{ site.time | date: '%s' }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="홈으로 이동">
          <span class="brand-mark" aria-hidden="true">S<span>_</span></span>
          <span class="brand-name">ssk0yy01</span>
        </a>
        <nav class="top-nav" aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}#categories">카테고리</a>
          <a href="{{ '/posts/' | relative_url }}">전체 글</a>
          <a href="{{ '/about/' | relative_url }}">소개</a>
          <a class="nav-github" href="https://github.com/ssk0yy01" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <strong>ssk0yy01<span class="accent-period">_</span></strong>
        <div class="footer-links"><a href="{{ '/about/' | relative_url }}">소개</a><a href="{{ '/posts/' | relative_url }}">전체 글</a><a href="https://github.com/ssk0yy01" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
      </div>
    </footer>
  </body>
</html>
