---
layout: default
---
<section class="home-screen">
  <div class="welcome">
    <span class="welcome-symbol">{% include icon.html name='cloud' %}</span>
    <h1>ssk0yy01<span class="accent-period">_</span></h1>
  </div>
  <div class="home-composer">
    <div class="composer-context"><span class="access-label">{% include icon.html name='shield' %}전체 액세스</span><span class="context-item">{% include icon.html name='folder' %}기록 보관함</span><span class="context-item context-posts">{% include icon.html name='book' %}전체 글</span></div>
    <form class="composer" action="{{ '/posts/' | relative_url }}" method="get" role="search">
      <label class="sr-only" for="home-search">블로그 글 검색</label>
      <input id="home-search" name="q" type="search" placeholder="어떤 기록을 찾고 있나요?" autocomplete="off">
      <div class="composer-bottom"><span class="model-label">이하늘-블로그 <span class="model-tier">Ultra</span></span><button class="send-button" type="submit" aria-label="검색">{% include icon.html name='arrow-up' %}</button></div>
    </form>
  </div>
</section>
