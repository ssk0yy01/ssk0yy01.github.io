<div class="credential-list">
  {% assign entries = site.credentials | where: 'group', include.group | sort: 'order' %}
  {% for entry in entries %}
  <a class="credential-card" href="{{ entry.url | relative_url }}">
    <span class="credential-date">{{ entry.period }}</span>
    <span class="credential-copy"><strong>{{ entry.title }}</strong><span>{{ entry.summary }}</span></span>
    <span class="credential-arrow" aria-hidden="true">↗</span>
  </a>
  {% endfor %}
</div>
