<section class="evidence-gallery{% if page.evidence_position == 'top' %} evidence-gallery--top{% endif %}" aria-label="인증 자료">
  {% unless page.evidence_position == 'top' %}<h2>인증 자료</h2>{% endunless %}
  {% for item in page.evidence %}
  <figure>
    <a href="{{ item.image | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ item.caption | escape }} 원본 보기 (새 창)">
      <img src="{{ item.image | relative_url }}" alt="{{ item.caption | escape }}" {% if item.width %}width="{{ item.width }}" height="{{ item.height }}"{% endif %} loading="{% if page.evidence_position == 'top' %}eager{% else %}lazy{% endif %}" decoding="async">
    </a>
    <figcaption>{{ item.caption }} <span>· 원본 보기 ↗</span></figcaption>
  </figure>
  {% endfor %}
</section>
